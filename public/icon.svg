<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="freezerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="frostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#freezerGrad)"/>
  
  <!-- Outer glowing rim -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Stylized Snowflake / Freezer Grid Icon -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Central Hexagon Core -->
    <polygon points="0,-24 20.78,-12 20.78,12 0,24 -20.78,12 -20.78,-12" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
    
    <!-- 6 Snowflake main arms with branches -->
    <!-- Arm 1: Top (0 deg) -->
    <g>
      <line x1="0" y1="-24" x2="0" y2="-150" stroke="url(#frostGrad)" stroke-width="14" stroke-linecap="round"/>
      <line x1="0" y1="-80" x2="-45" y2="-120" stroke="url(#frostGrad)" stroke-width="12" stroke-linecap="round"/>
      <line x1="0" y1="-80" x2="45" y2="-120" stroke="url(#frostGrad)" stroke-width="12" stroke-linecap="round"/>
      <line x1="0" y1="-120" x2="-30" y2="-145" stroke="url(#frostGrad)" stroke-width="10" stroke-linecap="round"/>
      <line x1="0" y1="-120" x2="30" y2="-145" stroke="url(#frostGrad)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="0" cy="-155" r="7" fill="#ffffff"/>
    </g>

    <!-- Arm 2: Bottom (180 deg) -->
    <g transform="rotate(180)">
      <line x1="0" y1="-24" x2="0" y2="-150" stroke="url(#frostGrad)" stroke-width="14" stroke-linecap="round"/>
      <line x1="0" y1="-80" x2="-45" y2="-120" stroke="url(#frostGrad)" stroke-width="12" stroke-linecap="round"/>
      <line x1="0" y1="-80" x2="45" y2="-120" stroke="url(#frostGrad)" stroke-width="12" stroke-linecap="round"/>
      <line x1="0" y1="-120" x2="-30" y2="-145" stroke="url(#frostGrad)" stroke-width="10" stroke-linecap="round"/>
      <line x1="0" y1="-120" x2="30" y2="-145" stroke="url(#frostGrad)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="0" cy="-155" r="7" fill="#ffffff"/>
    </g>

    <!-- Arm 3: Top-Right (60 deg) -->
    <g transform="rotate(60)">
      <line x1="0" y1="-24" x2="0" y2="-150" stroke="url(#frostGrad)" stroke-width="14" stroke-linecap="round"/>
      <line x1="0" y1="-80" x2="-45" y2="-120" stroke="url(#frostGrad)" stroke-width="12" stroke-linecap="round"/>
      <line x1="0" y1="-80" x2="45" y2="-120" stroke="url(#frostGrad)" stroke-width="12" stroke-linecap="round"/>
      <line x1="0" y1="-120" x2="-30" y2="-145" stroke="url(#frostGrad)" stroke-width="10" stroke-linecap="round"/>
      <line x1="0" y1="-120" x2="30" y2="-145" stroke="url(#frostGrad)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="0" cy="-155" r="7" fill="#ffffff"/>
    </g>

    <!-- Arm 4: Bottom-Right (120 deg) -->
    <g transform="rotate(120)">
      <line x1="0" y1="-24" x2="0" y2="-150" stroke="url(#frostGrad)" stroke-width="14" stroke-linecap="round"/>
      <line x1="0" y1="-80" x2="-45" y2="-120" stroke="url(#frostGrad)" stroke-width="12" stroke-linecap="round"/>
      <line x1="0" y1="-80" x2="45" y2="-120" stroke="url(#frostGrad)" stroke-width="12" stroke-linecap="round"/>
      <line x1="0" y1="-120" x2="-30" y2="-145" stroke="url(#frostGrad)" stroke-width="10" stroke-linecap="round"/>
      <line x1="0" y1="-120" x2="30" y2="-145" stroke="url(#frostGrad)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="0" cy="-155" r="7" fill="#ffffff"/>
    </g>

    <!-- Arm 5: Bottom-Left (240 deg) -->
    <g transform="rotate(240)">
      <line x1="0" y1="-24" x2="0" y2="-150" stroke="url(#frostGrad)" stroke-width="14" stroke-linecap="round"/>
      <line x1="0" y1="-80" x2="-45" y2="-120" stroke="url(#frostGrad)" stroke-width="12" stroke-linecap="round"/>
      <line x1="0" y1="-80" x2="45" y2="-120" stroke="url(#frostGrad)" stroke-width="12" stroke-linecap="round"/>
      <line x1="0" y1="-120" x2="-30" y2="-145" stroke="url(#frostGrad)" stroke-width="10" stroke-linecap="round"/>
      <line x1="0" y1="-120" x2="30" y2="-145" stroke="url(#frostGrad)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="0" cy="-155" r="7" fill="#ffffff"/>
    </g>

    <!-- Arm 6: Top-Left (300 deg) -->
    <g transform="rotate(300)">
      <line x1="0" y1="-24" x2="0" y2="-150" stroke="url(#frostGrad)" stroke-width="14" stroke-linecap="round"/>
      <line x1="0" y1="-80" x2="-45" y2="-120" stroke="url(#frostGrad)" stroke-width="12" stroke-linecap="round"/>
      <line x1="0" y1="-80" x2="45" y2="-120" stroke="url(#frostGrad)" stroke-width="12" stroke-linecap="round"/>
      <line x1="0" y1="-120" x2="-30" y2="-145" stroke="url(#frostGrad)" stroke-width="10" stroke-linecap="round"/>
      <line x1="0" y1="-120" x2="30" y2="-145" stroke="url(#frostGrad)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="0" cy="-155" r="7" fill="#ffffff"/>
    </g>
  </g>
</svg>
